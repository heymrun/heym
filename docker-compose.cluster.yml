# Two Heym instances, one database: main runs everything that touches local
# state, the worker takes a share of the rest. Postgres is the only channel
# between them.
#
# Set the split under Settings -> Instances once both are up.

name: heym-cluster

services:
  postgres:
    image: postgres:16
    container_name: heym-cluster-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-heym}
    volumes:
      # A named volume on local storage. Never a bind mount or an NFS share:
      # macOS virtiofs, WSL2 and NFS do not honour the fsync guarantees
      # PostgreSQL needs, and the data directory corrupts and PANICs over time.
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "6544:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Owns ingress, file storage, plugins, the editor and the portal, and runs
  # every MAIN_ONLY node: drive, converter, googleDrive, sendEmail, codex,
  # opencodeGo, fileUploadTrigger, plugin, and any agent with a skill attached.
  main:
    image: ${HEYM_BACKEND_IMAGE:-heym-backend:local}
    container_name: heym-cluster-main
    # SECRET_KEY and ENCRYPTION_KEY come from .env, so both instances match.
    # A mismatch marks the instance incompatible and it receives no work.
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-heym}
      HEYM_CLUSTER_ENABLED: "true"
      HEYM_INSTANCE_ROLE: main
      HEYM_INSTANCE_ID: main
      HEYM_INSTANCE_NAME: Main
      HEYM_OTEL_ENABLED: "false"
    # Chromium crashes on Docker's 64 MB /dev/shm. Step-based Playwright runs it
    # as a subprocess in this container, so the limit is this container's.
    shm_size: "2gb"
    ports:
      - "10105:10105"
    volumes:
      # The image predates the cluster code; mounting the source runs today's
      # tree without a rebuild. /app/.venv stays intact — /app is never mounted.
      - ./backend/app:/app/app:ro
      - ./backend/alembic:/app/alembic:ro
      # Sandbox nodes need a Docker socket, on every instance.
      - /var/run/docker.sock:/var/run/docker.sock
      # Local state only main owns.
      - cluster-files:/app/data/files
      - cluster-plugins:/app/data/plugins
      # A Codex follow-up resumes in the workspace its first run left behind.
      - codex-workspaces:/app/data/codex-workspaces
      - opencode-workspaces:/app/data/opencode-workspaces
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Reaches only the database. Takes ANYWHERE runs off the queue: http, llm,
  # plain agent, code, playwright, crawler, rag and the rest.
  worker-a:
    image: ${HEYM_BACKEND_IMAGE:-heym-backend:local}
    container_name: heym-cluster-worker-a
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-heym}
      HEYM_CLUSTER_ENABLED: "true"
      HEYM_INSTANCE_ROLE: worker
      HEYM_INSTANCE_ID: worker-a
      HEYM_INSTANCE_NAME: Worker A
      HEYM_OTEL_ENABLED: "false"
    shm_size: "2gb"
    # Skips the image entrypoint's migration step: main owns the schema.
    entrypoint: ["sh", "-c", "uv run python -m uvicorn app.main:app --host 0.0.0.0 --port 10105 --workers 4"]
    ports:
      # Inspection only (curl /api/health). Point no user traffic here: an
      # upload would land on main and its download would 404.
      - "10111:10105"
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/alembic:/app/alembic:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      main:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
  cluster-files:
  cluster-plugins:
  codex-workspaces:
  opencode-workspaces:
