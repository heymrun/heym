apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: heym-credentials
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: heym-credentials
subjects:
  - kind: ServiceAccount
    name: heym-backend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: heym-credentials
