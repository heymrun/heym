apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: heym-sandbox
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/attach"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: heym-sandbox
subjects:
  - kind: ServiceAccount
    name: heym-backend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: heym-sandbox
